name: Materialize submission candidate

on:
  push:
    branches:
      - agent/mnar-submission-ready
    paths:
      - submission_bundle.ready
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.head_ref == 'agent/mnar-submission-ready' || github.ref_name == 'agent/mnar-submission-ready' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mnar-submission-ready
          fetch-depth: 0
      - name: Unpack frozen submission tree
        shell: bash
        run: |
          shopt -s nullglob
          parts=(submission_bundle.b64.part*)
          test ${#parts[@]} -gt 0
          test -f submission_bundle.ready
          cat "${parts[@]}" | base64 --decode > /tmp/submission.tar.xz
          expected="$(tr -d '[:space:]' < submission_bundle.ready)"
          printf '%s  %s\n' "$expected" /tmp/submission.tar.xz | sha256sum -c -
          mkdir -p /tmp/submission
          tar -xJf /tmp/submission.tar.xz -C /tmp/submission
          cp -a /tmp/submission/. .
          rm -f submission_bundle.b64.part* submission_bundle.ready
          rm -f .github/workflows/materialize-submission.yml
          rm -f results/baseline_quality.csv results/finite_sample.csv
          rm -f results/gamma_misspecification.csv results/post_selection.csv
          rm -f results/random_mdp.csv results/transition_uncertainty.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize proofs, experiments, and AAAI submission package"
          git push origin HEAD:agent/mnar-submission-ready
