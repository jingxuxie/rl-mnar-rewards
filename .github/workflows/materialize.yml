name: Materialize research bundle

on:
  push:
    branches:
      - agent/mnar-partial-identification

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack staged source, manuscript, and results
        shell: bash
        run: |
          shopt -s nullglob
          parts=(project_bundle.b64.part*)
          if (( ${#parts[@]} == 0 )); then
            echo "No bundle parts remain; nothing to materialize."
            exit 0
          fi
          cat "${parts[@]}" | base64 --decode | tar -xz
          rm -f "${parts[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize proof, experiments, and manuscript"
          git push origin HEAD:agent/mnar-partial-identification
