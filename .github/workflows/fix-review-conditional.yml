name: Fix AAAI review conditional

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'agent/expand-aaai-paper' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-aaai-paper
          fetch-depth: 0
      - name: Use the nonconflicting format conditional
        shell: bash
        run: |
          set -euxo pipefail
          if [[ ! -f fix_review_conditional.ready ]]; then
            echo "Review conditional already repaired; nothing to do."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          old = '''\\ifAAAIReview
            % The official AAAI style selects aaai2027.bst.
          \\else
            \\bibliographystyle{plainnat}
          \\fi'''
          new = '''\\ifAAAIFormat
            % The official AAAI style selects aaai2027.bst.
          \\else
            \\bibliographystyle{plainnat}
          \\fi'''
          for name in ('paper/main.tex', 'paper/supplement.tex'):
              path = Path(name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected review bibliography block not found in {name}')
              path.write_text(text.replace(old, new))
          PY
          rm -f fix_review_conditional.ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/main.tex paper/supplement.tex fix_review_conditional.ready
          git commit -m "Fix AAAI review-mode conditional"
          git push origin HEAD:agent/expand-aaai-paper
