name: Materialize AAAI paper expansion

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.head_ref == 'agent/expand-aaai-paper' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/expand-aaai-paper
          fetch-depth: 0
      - name: Verify and unpack revision
        id: unpack
        shell: bash
        run: |
          set -euxo pipefail
          if [[ ! -f expansion_bundle.ready ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shopt -s nullglob
          parts=(expansion_bundle.b64.part*)
          test ${#parts[@]} -gt 0
          cat "${parts[@]}" | base64 --decode > /tmp/mnar-expansion.tar.xz
          expected="$(tr -d '[:space:]' < expansion_bundle.ready)"
          actual="$(sha256sum /tmp/mnar-expansion.tar.xz | cut -d' ' -f1)"
          test "$actual" = "$expected"
          mkdir -p /tmp/mnar-expansion
          tar -xJf /tmp/mnar-expansion.tar.xz -C /tmp/mnar-expansion
          cp -a /tmp/mnar-expansion/. .
          rm -f expansion_bundle.b64.part* expansion_bundle.ready
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Commit readable source tree
        if: steps.unpack.outputs.skip != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand theory, experiments, and related work"
          git push origin HEAD:agent/expand-aaai-paper
