name: Paper

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

jobs:
  build-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            texlive-science poppler-utils unzip
      - name: Download official AAAI-27 author kit
        run: |
          curl -fL https://aaai.org/authorkit27/ -o /tmp/AuthorKit27.zip
          unzip -q /tmp/AuthorKit27.zip -d /tmp/AuthorKit27
          find /tmp/AuthorKit27 -name aaai2027.sty -exec cp {} paper/ \;
          find /tmp/AuthorKit27 -name aaai2027.bst -exec cp {} paper/ \;
          test -f paper/aaai2027.sty
          test -f paper/aaai2027.bst
      - name: Build anonymous review artifacts
        run: |
          cd paper
          AAAI_MODE=review bash build.sh
      - name: Check page allocation, page size, and fonts
        run: python scripts/check_submission.py
      - uses: actions/upload-artifact@v4
        with:
          name: aaai-review-artifacts
          path: |
            paper/main.pdf
            paper/supplement.pdf
            paper/ReproducibilityChecklist.pdf
            paper/main.log
            paper/supplement.log
            paper/main.aux
